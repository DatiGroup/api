<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <style type="text/css">
        .body {
            font-family: 'Roboto', helvetica, sans-serif;
            font-size: 14px;
            background-color: var(--primary-color);
            border-radius: 12px;
            width: 90%;
            margin: 0;
            padding: 0;
            padding: 24px;
        }

        .header {
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 560px;
            box-sizing: border-box;
        }

        .content-row {
            width: 100%;
            margin-bottom: 16px;
            display: block;
        }

        .center {
            text-align: center;
        }

        .signature {
            color: #888888;
            font-size: 13px;
        }


        .footer {
            padding: 20px;
            background-color: var(--primary-color);
        }

        .text {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 16px;
            margin-top: 16px;
        }

        .footerText {
            text-align: center;
            font-size: 12px;
            color: var(--primary-color-text);
            line-height: 20px;
        }
    </style>
</head>

<body>
    <!-- Enclosing square -->
    <div class="body">
        <div style="max-width: 400px; min-width: 400px; margin-right: auto; margin-left: auto;">
            <div class="content">
                {{#if logoUrl}}
                <div style="text-align: center; padding-bottom: 20px;">
                    <img class="logo" src="{{logoUrl}}" alt="{{agentName}} logo"
                        style="height: 80px; max-width: 200px; display: block; margin: 0 auto;"
                        onerror="this.parentNode.style.display='none';">
                </div>
                {{else}}
                <div style="height: 20px;"></div> <!-- Small spacer if no logo -->
                {{/if}}
                <div class="header center">
                    <span>{{t "templates.rejectUser.title"}}</span>
                </div>

                <div class="center">
                    <span class="text">{{t
                        "templates.rejectUser.greeting" firstName=firstName}}</span>
                    <span class="text">{{t
                        "templates.rejectUser.text1"}}</span>
                    <span class="text">{{t
                        "templates.rejectUser.text2"}}</span>
                </div>

                <hr style="border:none;border-top:1px solid #eee;margin:10px 0;">

                <div class="greetingContainer">
                    <div class="center signature">{{t "templates.rejectUser.signature"}}</div>
                    <div class="center signature">{{t "templates.rejectUser.team"}}</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
