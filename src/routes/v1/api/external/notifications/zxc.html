<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <style type="text/css">
        /* CSS variables converted to inline styles */

        .body {
            font-family: 'Roboto', helvetica, sans-serif;
            font-size: 14px;
            background-color: #003399;
            border-radius: 12px;
            width: 90%;
            margin: 0;
            padding: 0;
            padding: 24px;
        }

        .header {
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 560px;
            box-sizing: border-box;
        }

        .content-row {
            width: 100%;
            margin-bottom: 16px;
            display: block;
        }

        .center {
            text-align: center;
        }

        .signature {
            color: #888888;
            font-size: 13px;
        }

        .button {
            background-color: #003399;
            color: #FFFFFF;
            padding: 12px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .footer {
            padding: 20px;
            background-color: #003399;
        }

        .greetingText {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: #003399;
            margin-bottom: 16px;
            margin-top: 16px;
        }

        .infoText {
            display: block;
            font-size: 15px;
            color: #444;
            line-height: 1.4;
        }

        .footerText {
            text-align: center;
            font-size: 12px;
            color: #FFFFFF;
            line-height: 20px;
        }

        .customContent {
            width: 100%;
        }
    </style>
    <style type="text/css">
        .header {
            color: red
        }

        .paragraph {
            font-style: italic
        }

        .paragraph .span {
            font-weight: bold
        }
    </style>
</head>

<body>
    <!-- Enclosing square -->
    <div class="body"
        style="font-family: 'Roboto', helvetica, sans-serif; font-size: 14px; background-color: #003399; border-radius: 12px; width: 90%; margin: 0; padding: 0; padding: 24px">
        <div style="max-width: 400px; min-width: 400px; margin-right: auto; margin-left: auto;">
            <div class="content"
                style="background-color: white; padding: 24px; border-radius: 12px; width: 100%; max-width: 560px; box-sizing: border-box">
                <div style="text-align: center; padding-bottom: 20px;">
                    <img class="logo"
                        src="https://ec.europa.eu/regional_policy/images/information-sources/logo-download-center/eu_flag.jpg"
                        alt="Digital Twins logo" style="height: 80px; max-width: 200px; display: block; margin: 0 auto;"
                        onerror="this.parentNode.style.display='none';">

                </div>
                <!-- <div class="header center" style="font-size: 24px; font-weight: 700; text-align: center"><span></span></div> -->
                <div class="customContent" style="width: 100%">
                    <div>
                        <h1 class='header' style='font-size: 24px; font-weight: 700'>Digital Twins</h1>
                        <p class='paragraph'>Something
                            <span class='span'>important</span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="footer" style="padding: 20px; background-color: #003399">
                <div class="footerText" style="text-align: center; font-size: 12px; color: #FFFFFF; line-height: 20px">
                    @2024 Digital Twins. All rights reserved.</div>
            </div>
        </div>
    </div>
</body>

</html>
